<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASA Systems — Signal attribution for serious traders</title>
  <meta name="description" content="ASA Systems is a Windows desktop app that auto-copies Telegram and Discord signals to MetaTrader 5 and shows you which signal providers are actually profitable." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="assets/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="shortcut icon" href="assets/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg:      '#FAFAF8',
            surface: '#FFFFFF',
            'surface-2': '#F3F4F6',
            border:  '#E5E7EB',
            primary: '#111827',
            muted:   '#6B7280',
            accent:  '#37AA35',
            'accent-dark': '#2d8f33',
            warn:    '#DC2626',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          letterSpacing: {
            tightish: '-0.02em',
            tighter2: '-0.03em',
          },
        },
      },
    };

  <style>
    html { scroll-behavior: smooth; }
    body {
      background: #FAFAF8;
      color: #111827;
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    h1, h2, h3, h4 { letter-spacing: -0.025em; line-height: 1.08; }
    section[id] { scroll-margin-top: 80px; }

    .font-display { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; font-weight: 800; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .hero-screenshot {
      animation: float 6s ease-in-out infinite;
      will-change: transform;
      position: relative;
    }
    .hero-screenshot > img {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: bicubic;
      transform: translateZ(0);
      backface-visibility: hidden;
    }
    /* ASA wordmark overlay — hides the in-app Tradespace logo in the top-left of the screenshot.
       Sidebar bg in hero-dashboard-full.png is #E4E4E7 — patch is invisible.
       Percentages are relative to the hero-screenshot wrapper, which sizes 1:1 with the img. */
    .hero-logo-overlay {
      position: absolute;
      top: 0.7%;
      left: 0.4%;
      width: 7.4%;
      height: 3.5%;
      background: #E4E4E7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 0.3%;
      z-index: 2;
      pointer-events: none;
    }
    .hero-logo-overlay img {
      height: 78%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      image-rendering: auto;
      filter: saturate(0.4) brightness(0.68);
    }

    /* Scroll-reveal — sections fade up as they enter the viewport */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      .hero-screenshot { animation: none; }
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    .h1-hero { font-size: clamp(2.25rem, 3.6vw + 1rem, 4.5rem); line-height: 1.05; letter-spacing: -0.03em; }
    .h1-fluid { font-size: clamp(2rem, 4vw, 3.5rem); line-height: 1.08; }
    .h2-fluid { font-size: clamp(2.25rem, 3.6vw, 3rem); line-height: 1.1; }
    .bg-pain { background: radial-gradient(circle at 50% 0%, rgba(220,38,38,0.06), transparent 60%), var(--bg); }
    .bg-prop { background: radial-gradient(circle at 50% 0%, rgba(55,170,53,0.06), transparent 55%), var(--bg); }
    .number-huge { font-size: clamp(2.25rem, 3.6vw, 3rem); line-height: 1; letter-spacing: -0.03em; }
    .step-huge { font-size: clamp(3.5rem, 6.5vw, 5.5rem); line-height: 0.9; letter-spacing: -0.04em; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .faq-grid { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 260ms cubic-bezier(.2,.0,.0,1), opacity 200ms ease; opacity: 0; }
    .faq-grid.open { grid-template-rows: 1fr; opacity: 1; }
    .faq-inner { overflow: hidden; }

    .feature-card { transition: border-color 200ms ease, transform 200ms ease, box-shadow 200ms ease; }
    .feature-card:hover { border-color: rgba(17,24,39,0.25); box-shadow: 0 8px 24px -12px rgba(17,24,39,0.10); }

    /* Popup widget animation */
    .widget-card-enter { transform: translateY(8px) scale(0.96); opacity: 0; }
    .widget-card-enter-active { transform: translateY(0) scale(1); opacity: 1; transition: transform 200ms cubic-bezier(.2,.0,.0,1), opacity 200ms ease; }

    /* Quiz funnel modal */
    .quiz-overlay { animation: quizFade 200ms ease forwards; }
    .quiz-card    { animation: quizPop 260ms cubic-bezier(.2,.0,.0,1) forwards; }
    .quiz-step    { animation: quizSlide 220ms cubic-bezier(.2,.0,.0,1) forwards; }
    @keyframes quizFade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes quizPop   { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes quizSlide { from { opacity: 0; transform: translateX(8px); }            to { opacity: 1; transform: translateX(0); } }

    /* Thank-you page check mark animation */
    @keyframes checkScale  { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes checkStroke { from { stroke-dashoffset: 60; }            to { stroke-dashoffset: 0; } }
    .ty-check-circle { animation: checkScale 380ms cubic-bezier(.2,.0,.0,1) forwards; }
    .ty-check-path   { stroke-dasharray: 60; stroke-dashoffset: 60; animation: checkStroke 480ms 220ms cubic-bezier(.2,.0,.0,1) forwards; }

    /* Trade History metrics — 3 cols on mobile, 6 on desktop */
    .th-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; padding: 14px 18px; border-bottom: 1px solid #e5e7eb; }
    @media (min-width: 640px) { .th-metrics { grid-template-columns: repeat(6, minmax(80px, 1fr)); } }
    /* Divider borders: right border on cols 1,2 in mobile 3-col; all but last in desktop */
    .th-metrics > div { border-right: 1px solid #e5e7eb; padding: 0 10px; }
    .th-metrics > div:first-child { padding-left: 0; }
    .th-metrics > div:last-child { border-right: none; }
    /* On mobile, remove right border from col 3 (last in row 1) and col 6 (last in row 2) */
    @media (max-width: 639px) {
      .th-metrics > div:nth-child(3) { border-right: none; padding-right: 0; }
      .th-metrics > div:nth-child(4) { padding-left: 0; }
      /* Add top border to second row */
      .th-metrics > div:nth-child(4),
      .th-metrics > div:nth-child(5),
      .th-metrics > div:nth-child(6) { border-top: 1px solid #e5e7eb; padding-top: 10px; margin-top: 2px; }
    }

    /* Interactive table rows */
    tbody tr { transition: background 130ms ease; }
    tbody tr:not(.no-hover):hover { background: rgba(55,170,53,0.04); }

    /* Security cards — same hover as feature cards */
    .security-card { transition: border-color 200ms ease, transform 200ms ease, box-shadow 200ms ease; }
    .security-card:hover { border-color: rgba(55,170,53,0.35); transform: translateY(-2px); box-shadow: 0 12px 28px -12px rgba(55,170,53,0.12); }

    /* Stat band cards */
    .stat-card { transition: background 200ms ease; }
    .stat-card:hover { background: rgba(55,170,53,0.03); }

    /* Mock leaderboard rows in hero — subtle hover to feel alive */
    .mock-row { transition: background 120ms ease; }
    .mock-row:hover { background: rgba(0,212,170,0.07) !important; }

    /* Smoother nav link underline */
    nav a { position: relative; }

    /* FAQ question hover */
    .faq-btn { transition: color 150ms ease; }

    /* ============================================================
       HTML mock components — render like real app screenshots
       ============================================================ */
    .mock-root {
      will-change: transform;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .mock-root .tnum { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }

    /* Dashboard mock — dark theme */
    .dash-mock {
      background: #0d0f12;
      color: #e8eaed;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 30px 80px -30px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.04);
    }
    .dash-mock .surface { background: #161a1f; border: 1px solid #2a2f38; }
    .dash-mock .pill {
      display: inline-flex; align-items: center;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 9px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      border: 1px solid #2a2f38;
      background: #1c2128;
      color: #cbd5e1;
    }
    .dash-mock .pill-accent { color: #4ade80; border-color: rgba(74,222,128,0.35); background: rgba(74,222,128,0.08); }
    .dash-mock .pill-orange { color: #f97316; border-color: rgba(249,115,22,0.4); background: rgba(249,115,22,0.08); }
    .dash-mock .text-muted-dark { color: #6b7280; }
    .dash-mock .text-green { color: #4ade80; }
    .dash-mock .text-orange { color: #f97316; }

    /* Trade-history mock — light theme */
    .th-mock { background: #ffffff; color: #111827; }
    .th-mock .row-divider { border-top: 1px solid #e5e7eb; }
    .th-mock .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px;
      font-size: 10px; font-weight: 700; line-height: 1.4;
    }
    .th-mock .pill-green { background: rgba(55,170,53,0.12); color: #2d8f33; }
    .th-mock .pill-amber { background: rgba(245,158,11,0.14); color: #b45309; }
    .th-mock .pill-purple { background: rgba(139,92,246,0.12); color: #6d28d9; }
    .th-mock .pill-gray  { background: #f3f4f6; color: #374151; }
    .th-mock .pill-red   { background: rgba(239,68,68,0.12); color: #b91c1c; }

    .tt-row { transition: background 130ms ease; }
    .tt-row:hover { background: #f9fafb; }
  </style>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, Fragment } = React;

    // ──────────────────────────────────────────────────────────────
    //  Stripe checkout URL placeholders (replaced at deploy time)
    // ──────────────────────────────────────────────────────────────
    // The literal strings below are deploy-time placeholders. The
    // build/deploy pipeline (Vercel env injection, sed step, or a
    // .env-driven pre-build script) replaces them with the live
    // Stripe Checkout links pulled from STRIPE_CHECKOUT_URL_STARTER,
    // STRIPE_CHECKOUT_URL_PRO, and STRIPE_CHECKOUT_URL_ELITE.
    //
    // Public tier name "Scale" maps to internal canonical "elite"
    // (matches billing.py's TIER_ALIASES — keeps the landing copy
    // and the Stripe price IDs in lockstep without a rename here).
    const STRIPE_CHECKOUT_URLS = {
      starter: "STRIPE_CHECKOUT_URL_STARTER",
      pro:     "STRIPE_CHECKOUT_URL_PRO",
      scale:   "STRIPE_CHECKOUT_URL_ELITE",
      elite:   "STRIPE_CHECKOUT_URL_ELITE",
    };
    const DEFAULT_CHECKOUT_URL = STRIPE_CHECKOUT_URLS.pro;

    /* ============================================================
       CountUp — animates a number from 0 → end when scrolled into
       view. Uses IntersectionObserver + requestAnimationFrame with
       an ease-out cubic. Triggers once, then stays put.
       ============================================================ */
    const CountUp = ({ end, duration = 800, suffix = "", className = "" }) => {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      const startedRef = useRef(false);

      useEffect(() => {
        const node = ref.current;
        if (!node) return;
        if (typeof IntersectionObserver === "undefined") {
          setVal(end);
          return;
        }
        const run = () => {
          if (startedRef.current) return;
          startedRef.current = true;
          const t0 = performance.now();
          const tick = (now) => {
            const t = Math.min(1, (now - t0) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            setVal(Math.round(eased * end));
            if (t < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        };
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) { setVal(end); return; }
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { run(); obs.disconnect(); } });
        }, { threshold: 0.4 });
        obs.observe(node);
        return () => obs.disconnect();
      }, [end, duration]);

      return <span ref={ref} className={className}>{val}{suffix}</span>;
    };

    /* ============================================================
       useReveal — adds a `visible` class to every `.reveal` element
       as it enters the viewport. CSS handles the fade/translate.
       ============================================================ */
    const useReveal = () => {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        if (!els.length) return;
        if (typeof IntersectionObserver === "undefined") {
          els.forEach((el) => el.classList.add('visible'));
          return;
        }
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add('visible');
              obs.unobserve(e.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
        els.forEach((el) => obs.observe(el));
        return () => obs.disconnect();
      }, []);
    };

                      Not feeling it? Compare all plans →
                    </button>
                    <p className="mt-2 text-[11px] text-muted text-center">
                      Cancel any time
                    </p>
                  </div>
                );
              })()}
            </div>
          </div>
        </div>
      );
    };

    /* ============================================================
       Sticky quiz pill — desktop only, slides in from the right
       once the visitor has scrolled past 30% of the page. Mirrors
       the Intercom-bubble pattern: persistent secondary CTA that
       intercepts indecision without competing with the hero.
       ============================================================ */
    const StickyQuizPill = () => {
      const openQuiz = useOpenQuiz();
      const [show, setShow] = useState(false);
      useEffect(() => {
        const onScroll = () => {
          const max  = document.documentElement.scrollHeight - window.innerHeight;
          const pct  = max > 0 ? window.scrollY / max : 0;
          setShow(pct > 0.30 && pct < 0.96);
        };
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      return (
        <div
          className={`hidden md:block fixed right-4 lg:right-6 bottom-20 z-40 transition-all duration-300 ${
            show ? "opacity-100 translate-y-0" : "opacity-0 translate-y-4 pointer-events-none"
          }`}
        >
          <button
            onClick={openQuiz}
            className="group flex items-center gap-2.5 bg-surface border border-border hover:border-accent shadow-xl shadow-gray-300/40 hover:shadow-accent/20 rounded-full pl-3 pr-5 py-2.5 transition-all"
            aria-label="Take the 60-second plan quiz"
          >
            <span className="w-7 h-7 rounded-full bg-accent text-bg flex items-center justify-center shrink-0 transition-transform group-hover:scale-105">
              <HelpIcon className="w-3.5 h-3.5" />
            </span>
            <span className="flex flex-col items-start leading-tight">
              <span className="text-[9px] font-semibold tracking-widest uppercase text-muted">60-second quiz</span>
              <span className="text-xs font-semibold text-primary">Find my plan →</span>
            </span>
          </button>
        </div>
      );
    };

    /* ============================================================
       Bottom-right popup widget
       ============================================================ */
    const SupportWidget = () => {
      const [open, setOpen] = useState(false);
      const [mounted, setMounted] = useState(false);
      useEffect(() => { setMounted(true); }, []);
      if (!mounted) return null;

      return (
        <div className="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-50">
          {open ? (
            <div
              className="widget-card-enter widget-card-enter-active w-[19rem] sm:w-80 bg-surface border border-border rounded-xl shadow-[0_20px_60px_-20px_rgba(17,24,39,0.20)] overflow-hidden"
              role="dialog"
              aria-label="Contact support"
            >
              <div className="relative px-5 pt-5 pb-3 border-b border-border bg-surface-2">
                <div className="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-accent to-transparent opacity-70"></div>
                <div className="flex items-start gap-3">
                  <div className="w-9 h-9 rounded-md bg-accent/15 border border-accent/40 flex items-center justify-center text-accent shrink-0">
                    <HelpIcon className="w-5 h-5" />
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-semibold text-primary">Questions? We reply within 24 hours.</p>
                    <p className="mt-1 text-xs text-muted leading-relaxed">A real person reads every email. No support ticket queue, no chatbot.</p>
                  </div>
                  <button
                    onClick={() => setOpen(false)}
                    className="-mt-1.5 -mr-1.5 p-2.5 min-w-[44px] min-h-[44px] text-muted hover:text-primary transition-colors inline-flex items-center justify-center"
                    aria-label="Close"
                  >
                    <CloseIcon className="w-4 h-4" />
                  </button>
                </div>
              </div>

              <div className="p-5 flex flex-col gap-3">
                <a
                  href="mailto:christoffermoshiri@gmail.com"
                  className="flex items-center gap-3 px-3 py-2.5 border border-border rounded-md hover:border-primary/30 transition-colors"
                >
                  <MailIcon className="w-4 h-4 text-muted shrink-0" />
                  <span className="text-sm text-primary truncate">christoffermoshiri@gmail.com</span>
                </a>
                <a
                  href={DEFAULT_CHECKOUT_URL}
                  className="inline-flex items-center justify-center gap-2 bg-accent hover:bg-accent/90 text-bg font-semibold text-sm px-4 py-2.5 rounded-md transition-colors"
                >
                  Start My Free Trial
                  <ArrowRightIcon className="w-4 h-4" />
                </a>
              </div>
            </div>
          ) : (
            <button
              onClick={() => setOpen(true)}
              className="inline-flex items-center gap-2 bg-surface border border-border hover:border-accent/50 text-primary px-4 py-3 rounded-full shadow-[0_10px_40px_-15px_rgba(17,24,39,0.20)] transition-colors"
              aria-label="Open contact widget"
            >
              <span className="w-7 h-7 rounded-full bg-accent/15 border border-accent/40 flex items-center justify-center text-accent">
                <ChatIcon className="w-4 h-4" />
              </span>
              <span className="text-sm font-medium">Got a question? <span className="text-muted hidden sm:inline">We reply within 24h</span></span>
            </button>
          )}
        </div>
      );
    };

    /* ============================================================
       Quiz context — exposes openQuiz() to any descendant CTA.
       ============================================================ */
    const QuizContext = React.createContext({ openQuiz: () => {} });
    const useOpenQuiz = () => React.useContext(QuizContext).openQuiz;
    const WaitlistContext = React.createContext({ openWaitlist: () => {} });
    const useOpenWaitlist = () => React.useContext(WaitlistContext).openWaitlist;

    /* ============================================================
       App
       ============================================================ */
    const App = () => {
      const [quizOpen, setQuizOpen] = useState(false);
      const openQuiz  = () => setQuizOpen(true);
      const closeQuiz = () => setQuizOpen(false);
      const [waitlistPlan, setWaitlistPlan] = useState(null);
      const openWaitlist = (plan = "Pro") => setWaitlistPlan(plan);

      useReveal();

      return (
        <QuizContext.Provider value={{ openQuiz }}>
          <WaitlistContext.Provider value={{ openWaitlist }}>
          <Navigation />
          <main>
            <Hero />
            <StatBand />
            <PainPoints />
            <EveryFillTagged />
            <ProblemSolution />
            <HowItWorks />
            <PropTraderMode />
            <Features />
            <Comparison />
            <ThreePositive />
            <Security />
            <Pricing />
            <FAQ />
            <FinalCTA />
          </main>
          <Footer />
          <StickyQuizPill />
          <SupportWidget />
          <QuizFunnel open={quizOpen} onClose={closeQuiz} />
          {waitlistPlan && (
            <WaitlistModal plan={waitlistPlan} onClose={() => setWaitlistPlan(null)} />
          )}
          </WaitlistContext.Provider>
        </QuizContext.Provider>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
