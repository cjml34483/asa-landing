<body class="bg-bg text-primary">

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, Fragment } = React;

    // ──────────────────────────────────────────────────────────────
    //  Stripe checkout URL placeholders (replaced at deploy time)
    // ──────────────────────────────────────────────────────────────
    // The literal strings below are deploy-time placeholders. The
    // build/deploy pipeline (Vercel env injection, sed step, or a
    // .env-driven pre-build script) replaces them with the live
    // Stripe Checkout links pulled from STRIPE_CHECKOUT_URL_STARTER,
    // STRIPE_CHECKOUT_URL_PRO, and STRIPE_CHECKOUT_URL_ELITE.
    //
    // Public tier name "Scale" maps to internal canonical "elite"
    // (matches billing.py's TIER_ALIASES — keeps the landing copy
    // and the Stripe price IDs in lockstep without a rename here).
    const STRIPE_CHECKOUT_URLS = {
      starter: "STRIPE_CHECKOUT_URL_STARTER",
      pro:     "STRIPE_CHECKOUT_URL_PRO",
      scale:   "STRIPE_CHECKOUT_URL_ELITE",
      elite:   "STRIPE_CHECKOUT_URL_ELITE",
    };
    const DEFAULT_CHECKOUT_URL = STRIPE_CHECKOUT_URLS.pro;

    /* ============================================================
       CountUp — animates a number from 0 → end when scrolled into
       view. Uses IntersectionObserver + requestAnimationFrame with
       an ease-out cubic. Triggers once, then stays put.
       ============================================================ */
    const CountUp = ({ end, duration = 800, suffix = "", className = "" }) => {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      const startedRef = useRef(false);

      useEffect(() => {
        const node = ref.current;
        if (!node) return;
        if (typeof IntersectionObserver === "undefined") {
          setVal(end);
          return;
        }
        const run = () => {
          if (startedRef.current) return;
          startedRef.current = true;
          const t0 = performance.now();
          const tick = (now) => {
            const t = Math.min(1, (now - t0) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            setVal(Math.round(eased * end));
            if (t < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        };
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) { setVal(end); return; }
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { run(); obs.disconnect(); } });
        }, { threshold: 0.4 });
        obs.observe(node);
        return () => obs.disconnect();
      }, [end, duration]);

      return <span ref={ref} className={className}>{val}{suffix}</span>;
    };

    /* ============================================================
       useReveal — adds a `visible` class to every `.reveal` element
       as it enters the viewport. CSS handles the fade/translate.
       ============================================================ */
    const useReveal = () => {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        if (!els.length) return;
        if (typeof IntersectionObserver === "undefined") {
          els.forEach((el) => el.classList.add('visible'));
          return;
        }
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add('visible');
              obs.unobserve(e.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
        els.forEach((el) => obs.observe(el));
        return () => obs.disconnect();
      }, []);
    };

    /* ============================================================
       Brand wordmark — the real raster lockup from
       marketing/landing/assets/asa-systems-wordmark.png.
       The SVG variants in branding/svg/ are a flat/simplified
       composite (crossbarless chevron A's + folded ribbon) that
       reads as "ΛΞΛ" at small sizes; the PNG is the proper brand
       mark with crossbar A's, depth-shaded green S, and "SYSTEMS"
       typeset alongside.
       ============================================================ */
    const AsaWordmark = ({ className = "h-8 w-auto", loading = "eager", style }) => (
      <img
        src="assets/asa-systems-wordmark.png"
        alt="ASA Systems"
        className={className}
        draggable={false}
        loading={loading}
        style={style}
      />
    );

    /* ============================================================
       DashboardMock — HTML/SVG replica of the ASA Terminal dark UI.
       Renders inside the hero in place of a screenshot.
       ============================================================ */
    const DashboardMock = () => {
      // Build a simplified candlestick series (ranging pattern, 30 bars)
      const candles = [];
      const baseY = 4760;
      const rangeHi = 4830;
      const rangeLo = 4690;
      const seed = [
        [4760, 4778, 4752, 4770, 1], [4770, 4790, 4762, 4785, 1], [4785, 4798, 4774, 4780, 0],
        [4780, 4795, 4768, 4774, 0], [4774, 4790, 4760, 4788, 1], [4788, 4810, 4782, 4805, 1],
        [4805, 4820, 4795, 4812, 1], [4812, 4825, 4806, 4810, 0], [4810, 4818, 4790, 4795, 0],
        [4795, 4808, 4780, 4802, 1], [4802, 4820, 4798, 4818, 1], [4818, 4830, 4810, 4815, 0],
        [4815, 4822, 4795, 4800, 0], [4800, 4812, 4785, 4790, 0], [4790, 4805, 4775, 4802, 1],
        [4802, 4818, 4795, 4815, 1], [4815, 4824, 4806, 4810, 0], [4810, 4815, 4792, 4798, 0],
        [4798, 4810, 4785, 4805, 1], [4805, 4820, 4798, 4815, 1], [4815, 4828, 4808, 4820, 1],
        [4820, 4825, 4805, 4810, 0], [4810, 4815, 4790, 4795, 0], [4795, 4810, 4785, 4806, 1],
        [4806, 4818, 4798, 4812, 1], [4812, 4818, 4800, 4805, 0], [4805, 4815, 4790, 4798, 0],
        [4798, 4815, 4795, 4812, 1], [4812, 4820, 4805, 4815, 1], [4815, 4822, 4808, 4813, 1],
      ];

      // Chart dims
      const W = 760, H = 280;
      const padL = 8, padR = 56, padT = 12, padB = 28;
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;
      const priceHi = 4840, priceLo = 4680;
      const yFor = (p) => padT + ((priceHi - p) / (priceHi - priceLo)) * chartH;
      const xFor = (i) => padL + (i + 0.5) * (chartW / seed.length);
      const cw = (chartW / seed.length) * 0.62;

      // Two MA lines — generated as smooth curves through approximate values
      const ma1Pts = seed.map((c, i) => `${xFor(i).toFixed(1)},${yFor(c[3] + 4).toFixed(1)}`).join(' ');
      const ma2Pts = seed.map((c, i) => `${xFor(i).toFixed(1)},${yFor(c[3] - 8).toFixed(1)}`).join(' ');

      const priceLabels = [4900, 4860, 4820, 4780, 4740, 4700, 4660];

      const metric = (label, value, valueClass, sub) => (
        <div className="surface tnum" style={{ padding: '10px 12px', borderRadius: 8, minWidth: 0 }}>
          <div style={{ fontSize: 9, letterSpacing: '0.12em', fontWeight: 700, color: '#6b7280', textTransform: 'uppercase' }}>{label}</div>
          <div className={`tnum ${valueClass || ''}`} style={{ fontSize: 22, fontWeight: 700, color: valueClass ? undefined : '#e8eaed', marginTop: 4, lineHeight: 1 }}>{value}</div>
          <div className="tnum" style={{ fontSize: 9, color: '#6b7280', marginTop: 5, lineHeight: 1.3 }}>{sub}</div>
        </div>
      );

      return (
        <div className="dash-mock mock-root" style={{ fontFamily: 'Plus Jakarta Sans, system-ui, sans-serif', fontSize: 12 }}>
          {/* Header bar */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '10px 14px', borderBottom: '1px solid #2a2f38', background: '#0d0f12' }}>
            <img src="branding/wordmark-header.png" alt="ASA" style={{ height: 16, width: 'auto', opacity: 0.95 }} onError={(e)=>{ e.currentTarget.style.display='none'; }} draggable={false} />
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 11, color: '#cbd5e1', flexWrap: 'nowrap', overflow: 'hidden' }}>
              <span style={{ fontWeight: 700, color: '#e8eaed' }}>XAUUSD</span>
              <span style={{ color: '#6b7280' }}>·</span>
              <span style={{ color: '#9ca3af' }}>Gold</span>
              <span className="tnum" style={{ color: '#e8eaed', fontWeight: 600 }}>4813.17 / 4813.39</span>
              <span className="pill" style={{ fontSize: 9 }}>SPR 22</span>
              <span className="tnum text-green" style={{ fontWeight: 700 }}>+£356.06</span>
              <span className="pill">RANGING</span>
              <span className="pill">NEW YORK</span>
            </div>
            <div style={{ marginLeft: 'auto', display: 'inline-flex', alignItems: 'center', gap: 6 }}>
              <span style={{ width: 6, height: 6, borderRadius: 999, background: '#4ade80', boxShadow: '0 0 8px rgba(74,222,128,0.7)' }}></span>
              <span style={{ fontSize: 9, letterSpacing: '0.12em', fontWeight: 700, color: '#4ade80', textTransform: 'uppercase' }}>Monitoring</span>
            </div>
          </div>

          {/* Metric cards */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, minmax(0, 1fr))', gap: 8, padding: '10px 12px' }}>
            {metric('Balance',        '£2226.40', '',           'start £1870.34')}
            {metric('Day P&L',        '+£356.06', 'text-green', 'bot +£35.47 · man +£320.59')}
            {metric('Win Rate',       '87%',      'text-green', 'bot 56% (5/9) · man 100% (21/21)')}
            {metric('Drawdown',       '0.0%',     '',           'from peak')}
            {metric('Profit Factor',  '6.69',     'text-green', 'WE418.66 / LE62.60')}
            {metric('Active Signal',  '—',        '',           'no signal')}
          </div>

          {/* Bottom metrics strip */}
          <div className="tnum" style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '8px 14px', borderTop: '1px solid #2a2f38', borderBottom: '1px solid #2a2f38', fontSize: 10, color: '#9ca3af', overflow: 'hidden', flexWrap: 'wrap' }}>
            <span><span style={{ color: '#6b7280', letterSpacing: '0.1em', fontWeight: 700 }}>AVG EXEC</span> <span style={{ color: '#e8eaed', fontWeight: 600 }}>40.1pip</span></span>
            <span style={{ color: '#2a2f38' }}>|</span>
            <span><span style={{ color: '#6b7280', letterSpacing: '0.1em', fontWeight: 700 }}>STREAK</span> <span style={{ color: '#4ade80', fontWeight: 600 }}>W2</span></span>
            <span style={{ color: '#2a2f38' }}>|</span>
            <span><span style={{ color: '#6b7280', letterSpacing: '0.1em', fontWeight: 700 }}>EXPECTANCY</span> <span style={{ color: '#4ade80', fontWeight: 600 }}>+£11.87</span></span>
            <span style={{ color: '#2a2f38' }}>|</span>
            <span><span style={{ color: '#6b7280', letterSpacing: '0.1em', fontWeight: 700 }}>TRADES</span> <span style={{ color: '#e8eaed', fontWeight: 600 }}>30</span></span>
            <span style={{ color: '#2a2f38' }}>|</span>
            <span><span style={{ color: '#6b7280', letterSpacing: '0.1em', fontWeight: 700 }}>EXPOSURE</span> <span style={{ color: '#e8eaed', fontWeight: 600 }}>0.00L</span></span>
            <span style={{ color: '#2a2f38' }}>|</span>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
              <span style={{ color: '#6b7280', letterSpacing: '0.1em', fontWeight: 700 }}>RISK</span>
              <span style={{ display: 'inline-flex', gap: 2 }}>
                {[1,2,3,4].map(i => <span key={i} style={{ width: 6, height: 6, background: i <= 1 ? '#4ade80' : '#2a2f38' }}></span>)}
              </span>
              <span style={{ color: '#4ade80', fontWeight: 700 }}>LOW</span>
            </span>
          </div>

          {/* Chart */}
          <div style={{ background: '#0d0f12', padding: '8px 0 0' }}>
            <svg viewBox={`0 0 ${W} ${H}`} width="100%" preserveAspectRatio="none" style={{ display: 'block', height: 260 }}>
              {/* gridlines */}
              {priceLabels.map((p) => (
                <line key={p} x1={padL} x2={W - padR} y1={yFor(p)} y2={yFor(p)} stroke="#1c2128" strokeWidth="1" />
              ))}

              {/* candles */}
              {seed.map(([o,h,l,c,up], i) => {
                const x = xFor(i);
                const color = up ? '#4ade80' : '#ef4444';
                return (
                  <g key={i}>
                    <line x1={x} x2={x} y1={yFor(h)} y2={yFor(l)} stroke={color} strokeWidth="1" />

          { key: "B", emoji: "🌀", label: "3 to 5 — getting busy",                              echo: "juggling 3–5 providers at once" },
          { key: "C", emoji: "🌐", label: "6 or more — and yes, it's becoming chaos",           echo: "running 6+ providers and feeling the chaos" },
          { key: "D", emoji: "🔭", label: "Still hunting for ones actually worth following",    echo: "still hunting for providers worth following" },
        ],
      },
      {
        q: "What's your trading setup look like?",
        sub: "We tune prop-firm rules, risk presets, and stealth mode based on this.",
        progress: "Halfway there — Question 3 of 5",
        momentumPct: 58,
        opts: [
          { key: "A", emoji: "💼", label: "My own live account — personal capital",                 echo: "trading on your own personal account" },
          { key: "B", emoji: "🏆", label: "Funded prop account — FTMO, FundedNext, The5ers…",         echo: "trading a funded prop firm account" },
          { key: "C", emoji: "🏛", label: "Multiple accounts — running it like a fund",              echo: "managing multiple accounts side-by-side" },
          { key: "D", emoji: "🧪", label: "Demo / paper trading for now",                             echo: "testing things out in demo first" },
        ],
      },
      {
        q: "What hurts most about how you trade right now?",
        sub: "The traders who fix this first compound the fastest. No wrong answer.",
        progress: "Just 2 more — Question 4 of 5",
        momentumPct: 75,
        opts: [
          { key: "A", emoji: "😴", label: "Missing trades while I'm asleep or at work",                            echo: "missing trades while you sleep or work" },
          { key: "B", emoji: "⏱",  label: "Manual copying is too slow — I'm slipping every entry",                  echo: "slipping entries because manual copying is too slow" },
          { key: "C", emoji: "📉", label: "I have no idea which providers are actually making me money",            echo: "having no clear view of which providers are profitable" },
          { key: "D", emoji: "🔒", label: "I don't fully trust automation with my account yet",                     echo: "wanting automation without giving up control" },
        ],
      },
      {
        q: "If ASA worked perfectly for you, what changes?",
        sub: "Last one. This is what we'll use to lock in your plan.",
        progress: "Last question — your plan is next",
        momentumPct: 90,
        opts: [
          { key: "A", emoji: "🎯", label: "I never miss another signal — ever",                            echo: "never missing another signal" },
          { key: "B", emoji: "📊", label: "I scale across multiple providers, systematically",             echo: "scaling across providers systematically" },
          { key: "C", emoji: "🔬", label: "I finally know which signals are worth paying for",             echo: "finally knowing which signals are worth paying for" },
          { key: "D", emoji: "🎛", label: "I automate without losing control of my account",               echo: "automating with full control of your account" },
        ],
      },
    ];

    /* Plan copy is tuned to land *as a personalised match* — the
       results screen weaves the trader's own words back at them
       before naming the plan, so the reveal feels like a fit
       diagnosis, not a generic upsell. */
    const PLAN_RECOMMENDATIONS = {
      starter: {
        id: "starter",
        name: "ASA Starter",
        price: "£19",
        cadence: "/mo",
        pitch: "Lean, focused, and built for one account and a couple of trusted providers.",
        bullets: [
          "1 MT5 account",
          "3 signal providers",
          "Full attribution + leaderboard",
          "Every core feature, no asterisks",
        ],
      },
      pro: {
        id: "pro",
        name: "ASA Pro",
        price: "£35",
        cadence: "/mo",
        pitch: "Built for the trader running multiple providers — with prop-firm guardrails on every trade.",
        bullets: [
          "3 MT5 accounts",
          "Unlimited providers",
          "AI parsing + stealth mode",
          "Per-provider Sharpe ratio",
          "Prop-firm rule enforcement",
        ],
      },
      business: {
        id: "scale",
        name: "ASA Scale",
        price: "£59",
        cadence: "/mo",
        pitch: "For traders running multiple accounts at fund-style scale — and the engine to back it.",
        bullets: [
          "5 MT5 accounts",
          "Unlimited providers",
          "Priority support",
          "Everything in Pro",
        ],
      },
    };

    /* Tailored reasons the recommended plan fits — one line each
       per Q3 (setup) and Q4 (pain). These are stitched into the
       results screen so the visitor sees their *own* answer
       turned into a why-this-plan-fits sentence. */
    const REASONS_BY_PAIN = {
      A: "you'll want fully automated execution running 24/7 — the core of every ASA plan.",
      B: "you need sub-100ms execution — ASA places the trade faster than you finish reading the Telegram message.",
      C: "you'll live in the Provider Leaderboard tab — Sharpe ratio and R-multiple per provider, attributed in 60 seconds.",
      D: "stealth mode and prop-firm rule enforcement check every trade before it goes live — automation without surrendering control.",
    };
    const REASONS_BY_SETUP = {
      A: "one MT5 account is enough — Starter handles it cleanly.",
      B: "every prop-firm preset is pre-loaded — FTMO, FundedNext, The5ers and ten more, checked before every entry.",
      C: "running multiple accounts in parallel is where Scale earns its money.",
      D: "demo's a great place to learn — and you can upgrade the moment you go live.",
    };

    const recommendPlan = (answers) => {
      const map = { A: 0, B: 1, C: 2, D: 1 };
      const score = answers.reduce((s, a) => s + (map[a] ?? 1), 0);
      if (score <= 3) return PLAN_RECOMMENDATIONS.starter;
      if (score <= 7) return PLAN_RECOMMENDATIONS.pro;
      return PLAN_RECOMMENDATIONS.business;
    };

    /* Pull the matching option-echo strings out of the answer keys
       so the results screen can recap "Here's what we heard…" in
       the trader's own words. */
    const echoFor = (qIndex, answerKey) => {
      const opt = QUIZ_QUESTIONS[qIndex]?.opts.find(o => o.key === answerKey);
      return opt ? opt.echo : null;
    };

    const QuizFunnel = ({ open, onClose }) => {
      const [step, setStep]       = useState(0); // 0..4 = questions, 5 = capture, 6 = result
      const [answers, setAnswers] = useState([]);
      const [name, setName]       = useState("");
      const [email, setEmail]     = useState("");
      const [phone, setPhone]     = useState("");
      const [submitting, setSubmitting] = useState(false);
      const [emailErr, setEmailErr]     = useState("");

      // Lock body scroll while open
      useEffect(() => {
        if (!open) return;
        const prev = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        return () => { document.body.style.overflow = prev; };
      }, [open]);

      // Esc key closes
      useEffect(() => {
        if (!open) return;
        const h = (e) => { if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", h);
        return () => window.removeEventListener("keydown", h);
      }, [open, onClose]);

      const reset = () => { setStep(0); setAnswers([]); setName(""); setEmail(""); setPhone(""); setEmailErr(""); };

      // Reset when opened
      useEffect(() => { if (open) reset(); }, [open]);

      if (!open) return null;

      const plan = step >= 6 ? recommendPlan(answers) : null;

      // Progress bar is psychologically front-loaded — each
      // question pre-fills further than its raw fraction so the
      // visitor never feels like they're back at the start.
      const PROGRESS_BY_STEP = [
        QUIZ_QUESTIONS[0].momentumPct,
        QUIZ_QUESTIONS[1].momentumPct,
        QUIZ_QUESTIONS[2].momentumPct,
        QUIZ_QUESTIONS[3].momentumPct,
        QUIZ_QUESTIONS[4].momentumPct,
        96, // capture
        100, // result
      ];
      const pct = PROGRESS_BY_STEP[Math.min(step, PROGRESS_BY_STEP.length - 1)];

      const progressLabel =
        step < QUIZ_QUESTIONS.length ? QUIZ_QUESTIONS[step].progress
        : step === QUIZ_QUESTIONS.length ? "One step from your match"
        : "Your match";

      const pickAnswer = (key) => {
        const next = [...answers];
        next[step] = key;
        setAnswers(next);
        // Tiny delay so the selection is visible before advancing
        setTimeout(() => setStep((s) => s + 1), 180);
      };

      const goBack = () => { if (step > 0) setStep((s) => s - 1); };

      const submitCapture = async (e) => {
        e.preventDefault();
        const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        if (!ok) { setEmailErr("Please enter a valid email"); return; }
        setEmailErr("");
        setSubmitting(true);

        const rec = recommendPlan(answers);
        const payload = {
          name: name || null,
          email,
          phone: phone || null,
          source: "quiz",
          plan: rec.id,
          answers,
        };

        // Fire-and-forget — don't block the user on the network
        try {
          fetch("/api/waitlist", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            keepalive: true,
          }).catch(() => {});
        } catch (_) { /* ignore — local file open, etc. */ }

        // Reveal result immediately — don't gate behind the network
        setTimeout(() => { setSubmitting(false); setStep(6); }, 220);
      };

      const registerHref = (() => {
        const rec = plan || recommendPlan(answers.length ? answers : ["B"]);
        return STRIPE_CHECKOUT_URLS[rec.id] || DEFAULT_CHECKOUT_URL;
      })();

      // Recap line for the results screen — turns the trader's
      // own answers into one fluent sentence they'll recognise.
      const buildRecap = () => {
        const q1 = echoFor(0, answers[0]);
        const q2 = echoFor(1, answers[1]);
        const q3 = echoFor(2, answers[2]);
        const q4 = echoFor(3, answers[3]);
        const q5 = echoFor(4, answers[4]);
        return { q1, q2, q3, q4, q5 };
      };

      const reasonsForResult = () => {
        const pain  = answers[3];
        const setup = answers[2];
        return [
          REASONS_BY_PAIN[pain],
          REASONS_BY_SETUP[setup],
        ].filter(Boolean);
      };

      return (
        <div
          className="quiz-overlay fixed inset-0 z-[60] bg-primary/60 backdrop-blur-sm flex items-stretch sm:items-center justify-center"
          role="dialog"
          aria-modal="true"
          aria-label="Find my plan"
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
        >
          <div className="quiz-card relative w-full sm:max-w-xl mx-0 sm:mx-4 bg-surface sm:rounded-2xl shadow-2xl shadow-gray-900/30 flex flex-col max-h-screen sm:max-h-[92vh] overflow-hidden">
            {/* Progress bar — pre-filled for momentum */}
            <div className="h-1.5 bg-border w-full">
              <div className="h-full bg-accent transition-all duration-500 ease-out" style={{ width: pct + "%" }}></div>
            </div>

            {/* Top bar */}
            <div className="flex items-center justify-between px-5 pt-5">
              {step > 0 && step < 6 ? (
                <button
                  onClick={goBack}
                  className="inline-flex items-center gap-1.5 text-xs font-semibold text-muted hover:text-primary transition-colors p-2 -ml-2"
                  aria-label="Back"
                >
                  <ArrowRightIcon className="w-3.5 h-3.5 rotate-180" />
                  Back
                </button>
              ) : (
                <span />
              )}
              <span className="text-[11px] font-semibold tracking-widest uppercase text-muted">
                {progressLabel}
              </span>
              <button
                onClick={onClose}
                className="p-2 -mr-2 text-muted hover:text-primary transition-colors"
                aria-label="Close"
              >
                <CloseIcon className="w-5 h-5" />
              </button>
            </div>

            <div className="px-6 sm:px-8 pt-6 pb-8 overflow-y-auto">
              {step < QUIZ_QUESTIONS.length && (
                <div key={step} className="quiz-step">
                  <h2 className="font-display text-2xl sm:text-[28px] text-primary leading-tight tracking-tight">
                    {QUIZ_QUESTIONS[step].q}
                  </h2>
                  <p className="mt-3 text-sm text-muted leading-relaxed">
                    {QUIZ_QUESTIONS[step].sub}
                  </p>
                  <div className="mt-7 flex flex-col gap-2.5">
                    {QUIZ_QUESTIONS[step].opts.map((o) => {
                      const selected = answers[step] === o.key;
                      return (
                        <button
                          key={o.key}
                          onClick={() => pickAnswer(o.key)}
                          className={`text-left w-full flex items-center gap-4 px-4 py-4 rounded-xl border-2 transition-all duration-150 ${
                            selected
                              ? "border-accent bg-accent/10"
                              : "border-border hover:border-accent/60 hover:bg-accent/[0.04] hover:-translate-y-0.5 hover:shadow-md"
                          }`}
                        >
                          <span className="w-10 h-10 rounded-lg bg-surface-2 border border-border flex items-center justify-center text-xl shrink-0">
                            {o.emoji}
                          </span>
                          <span className="text-[15px] font-medium text-primary leading-snug">
                            {o.label}
                          </span>
                          {selected && (
                            <span className="ml-auto text-accent shrink-0">
                              <CheckIcon className="w-5 h-5" />
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              {step === QUIZ_QUESTIONS.length && (
                <div className="quiz-step">
                  <div className="inline-flex items-center gap-2 text-[11px] font-bold tracking-widest uppercase text-accent border border-accent/40 bg-accent/10 rounded-full px-3 py-1.5">
                    <CheckIcon className="w-3.5 h-3.5" />
                    Match found
                  </div>
                  <h2 className="mt-4 font-display text-2xl sm:text-3xl text-primary leading-tight tracking-tight">
                    Your plan's ready. Where should we send it?
                  </h2>
                  <p className="mt-3 text-sm sm:text-base text-muted leading-relaxed">
                    We'll email you the match, the price, and the 5-minute setup guide. One email. No drip campaign.
                  </p>

                  <form className="mt-7 flex flex-col gap-4" onSubmit={submitCapture}>
                    <label className="flex flex-col gap-1.5">
                      <span className="text-xs font-semibold text-primary/80">First name</span>
                      <input
                        type="text"
                        value={name}
                        onChange={(e) => setName(e.target.value)}
                        placeholder="Alex"
                        autoComplete="given-name"
                        className="px-4 py-3 rounded-lg border border-border bg-surface text-primary placeholder:text-muted/70 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/30"
                      />
                    </label>
                    <label className="flex flex-col gap-1.5">
                      <span className="text-xs font-semibold text-primary/80">Email <span className="text-warn">*</span></span>
                      <input
                        type="email"
                        required
                        value={email}
                        onChange={(e) => { setEmail(e.target.value); if (emailErr) setEmailErr(""); }}
                        placeholder="you@email.com"
                        autoComplete="email"
                        className={`px-4 py-3 rounded-lg border bg-surface text-primary placeholder:text-muted/70 focus:outline-none focus:ring-2 ${
                          emailErr
                            ? "border-warn focus:border-warn focus:ring-warn/30"
                            : "border-border focus:border-accent focus:ring-accent/30"
                        }`}
                      />
                      {emailErr && <span className="text-xs text-warn">{emailErr}</span>}
                    </label>
                    <label className="flex flex-col gap-1.5">
                      <span className="text-xs font-semibold text-primary/80">
                        Phone <span className="font-normal text-muted">(optional — get the MT5 connection guide by SMS)</span>
                      </span>
                      <input
                        type="tel"
                        value={phone}
                        onChange={(e) => setPhone(e.target.value)}
                        placeholder="+44 7…"
                        autoComplete="tel"
                        className="px-4 py-3 rounded-lg border border-border bg-surface text-primary placeholder:text-muted/70 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/30"
                      />
                    </label>
                    <button
                      type="submit"
                      disabled={submitting}
                      className="mt-2 inline-flex items-center justify-center gap-2 bg-accent hover:bg-accent/90 disabled:opacity-70 text-bg font-semibold px-6 py-3.5 rounded-lg transition-colors shadow-[0_8px_24px_-12px_rgba(55,170,53,0.6)]"
                    >
                      {submitting ? "Matching…" : "Reveal my match"}
                      <ArrowRightIcon className="w-4 h-4" />
                    </button>
                    <p className="text-[11px] text-muted text-center">No spam. Unsubscribe in one click. We'll only ever email about ASA.</p>
                  </form>
                </div>
              )}

              {step === 6 && plan && (() => {
                const recap = buildRecap();
                const reasons = reasonsForResult();
                return (
                  <div className="quiz-step">
                    <div className="inline-flex items-center gap-2 text-[11px] font-bold tracking-widest uppercase text-accent border border-accent/40 bg-accent/10 rounded-full px-3 py-1.5">
                      <CheckIcon className="w-3.5 h-3.5" /> Matched for you
                    </div>

                    <p className="mt-5 text-sm text-muted">Here's what you told us:</p>
                    <ul className="mt-3 space-y-1.5 text-sm text-primary/90 leading-snug">
                      {recap.q1 && <li className="flex gap-2"><span className="text-accent">·</span><span>You're <span className="font-semibold">{recap.q1}</span>.</span></li>}
                      {recap.q2 && <li className="flex gap-2"><span className="text-accent">·</span><span>You're currently <span className="font-semibold">{recap.q2}</span>.</span></li>}
                      {recap.q3 && <li className="flex gap-2"><span className="text-accent">·</span><span>You're <span className="font-semibold">{recap.q3}</span>.</span></li>}
                      {recap.q4 && <li className="flex gap-2"><span className="text-accent">·</span><span>Your biggest pain: <span className="font-semibold">{recap.q4}</span>.</span></li>}
                      {recap.q5 && <li className="flex gap-2"><span className="text-accent">·</span><span>What you want: <span className="font-semibold">{recap.q5}</span>.</span></li>}
                    </ul>

                    <h2 className="mt-7 font-display text-3xl sm:text-4xl text-primary leading-tight tracking-tight">
                      {plan.name}.
                    </h2>
                    <p className="mt-3 text-base text-primary/80 leading-relaxed">
                      {plan.pitch}
                    </p>

                    {reasons.length > 0 && (
                      <div className="mt-5 border-l-2 border-accent pl-4 space-y-2.5">
                        {reasons.map((r, i) => (
                          <p key={i} className="text-sm text-primary/85 leading-relaxed">
                            <span className="text-accent font-semibold">Because </span>{r}
                          </p>
                        ))}
                      </div>
                    )}

                    <div className="mt-7 rounded-xl border-2 border-accent bg-accent/5 p-6 shadow-[0_18px_45px_-25px_rgba(55,170,53,0.45)]">
                      <div className="flex items-baseline gap-2">
                        <span className="text-4xl font-bold text-primary tracking-tighter2">{plan.price}</span>
                        <span className="text-sm text-muted">{plan.cadence}</span>
                        <span className="ml-auto text-[11px] font-semibold tracking-widest uppercase text-accent">14-day free trial</span>
                      </div>
                      <ul className="mt-5 space-y-2.5">
                        {plan.bullets.map((b) => (
                          <li key={b} className="flex items-start gap-3 text-sm text-primary/85">
                            <CheckIcon className="w-4 h-4 mt-0.5 text-accent shrink-0" />
                            <span>{b}</span>
                          </li>
                        ))}
                      </ul>
                    </div>

                    <a
                      href={registerHref}
                      className="mt-6 inline-flex items-center justify-center gap-2 bg-accent hover:bg-accent/90 text-bg font-semibold px-6 py-3.5 rounded-lg transition-colors shadow-[0_8px_24px_-12px_rgba(55,170,53,0.6)] w-full"
                    >
                      Start {plan.name} free for 14 days
                      <ArrowRightIcon className="w-4 h-4" />
                    </a>
                    <button
                      onClick={() => { onClose(); setTimeout(() => { const el = document.getElementById('pricing'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 50); }}
                      className="mt-3 w-full text-center text-sm text-muted hover:text-primary transition-colors py-2"
                    >
                      Not feeling it? Compare all plans →
                    </button>
                    <p className="mt-2 text-[11px] text-muted text-center">
                      Cancel any time
                    </p>
                  </div>
                );
              })()}
            </div>
          </div>
        </div>
      );
    };

    /* ============================================================
       Sticky quiz pill — desktop only, slides in from the right
       once the visitor has scrolled past 30% of the page. Mirrors
       the Intercom-bubble pattern: persistent secondary CTA that
       intercepts indecision without competing with the hero.
       ============================================================ */
    const StickyQuizPill = () => {
      const openQuiz = useOpenQuiz();
      const [show, setShow] = useState(false);
      useEffect(() => {
        const onScroll = () => {
          const max  = document.documentElement.scrollHeight - window.innerHeight;
          const pct  = max > 0 ? window.scrollY / max : 0;
          setShow(pct > 0.30 && pct < 0.96);
        };
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      return (
        <div
          className={`hidden md:block fixed right-4 lg:right-6 bottom-20 z-40 transition-all duration-300 ${
            show ? "opacity-100 translate-y-0" : "opacity-0 translate-y-4 pointer-events-none"
          }`}
        >
          <button
            onClick={openQuiz}
            className="group flex items-center gap-2.5 bg-surface border border-border hover:border-accent shadow-xl shadow-gray-300/40 hover:shadow-accent/20 rounded-full pl-3 pr-5 py-2.5 transition-all"
            aria-label="Take the 60-second plan quiz"
          >
            <span className="w-7 h-7 rounded-full bg-accent text-bg flex items-center justify-center shrink-0 transition-transform group-hover:scale-105">
              <HelpIcon className="w-3.5 h-3.5" />
            </span>
            <span className="flex flex-col items-start leading-tight">
              <span className="text-[9px] font-semibold tracking-widest uppercase text-muted">60-second quiz</span>
              <span className="text-xs font-semibold text-primary">Find my plan →</span>
            </span>
          </button>
        </div>
      );
    };

    /* ============================================================
       Bottom-right popup widget
       ============================================================ */
    const SupportWidget = () => {
      const [open, setOpen] = useState(false);
      const [mounted, setMounted] = useState(false);
      useEffect(() => { setMounted(true); }, []);
      if (!mounted) return null;

      return (
        <div className="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-50">
          {open ? (
            <div
              className="widget-card-enter widget-card-enter-active w-[19rem] sm:w-80 bg-surface border border-border rounded-xl shadow-[0_20px_60px_-20px_rgba(17,24,39,0.20)] overflow-hidden"
              role="dialog"
              aria-label="Contact support"
            >
              <div className="relative px-5 pt-5 pb-3 border-b border-border bg-surface-2">
                <div className="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-accent to-transparent opacity-70"></div>
                <div className="flex items-start gap-3">
                  <div className="w-9 h-9 rounded-md bg-accent/15 border border-accent/40 flex items-center justify-center text-accent shrink-0">
                    <HelpIcon className="w-5 h-5" />
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-semibold text-primary">Questions? We reply within 24 hours.</p>
                    <p className="mt-1 text-xs text-muted leading-relaxed">A real person reads every email. No support ticket queue, no chatbot.</p>
                  </div>
                  <button
                    onClick={() => setOpen(false)}
                    className="-mt-1.5 -mr-1.5 p-2.5 min-w-[44px] min-h-[44px] text-muted hover:text-primary transition-colors inline-flex items-center justify-center"
                    aria-label="Close"
                  >
                    <CloseIcon className="w-4 h-4" />
                  </button>
                </div>
              </div>

              <div className="p-5 flex flex-col gap-3">
                <a
                  href="mailto:christoffermoshiri@gmail.com"
                  className="flex items-center gap-3 px-3 py-2.5 border border-border rounded-md hover:border-primary/30 transition-colors"
                >
                  <MailIcon className="w-4 h-4 text-muted shrink-0" />
                  <span className="text-sm text-primary truncate">christoffermoshiri@gmail.com</span>
                </a>
                <a
                  href={DEFAULT_CHECKOUT_URL}
                  className="inline-flex items-center justify-center gap-2 bg-accent hover:bg-accent/90 text-bg font-semibold text-sm px-4 py-2.5 rounded-md transition-colors"
                >
                  Start My Free Trial
                  <ArrowRightIcon className="w-4 h-4" />
                </a>
              </div>
            </div>
          ) : (
            <button
              onClick={() => setOpen(true)}
              className="inline-flex items-center gap-2 bg-surface border border-border hover:border-accent/50 text-primary px-4 py-3 rounded-full shadow-[0_10px_40px_-15px_rgba(17,24,39,0.20)] transition-colors"
              aria-label="Open contact widget"
            >
              <span className="w-7 h-7 rounded-full bg-accent/15 border border-accent/40 flex items-center justify-center text-accent">
                <ChatIcon className="w-4 h-4" />
              </span>
              <span className="text-sm font-medium">Got a question? <span className="text-muted hidden sm:inline">We reply within 24h</span></span>
            </button>
          )}
        </div>
      );
    };

    /* ============================================================
       Quiz context — exposes openQuiz() to any descendant CTA.
       ============================================================ */
    const QuizContext = React.createContext({ openQuiz: () => {} });
    const useOpenQuiz = () => React.useContext(QuizContext).openQuiz;
    const WaitlistContext = React.createContext({ openWaitlist: () => {} });
    const useOpenWaitlist = () => React.useContext(WaitlistContext).openWaitlist;

    /* ============================================================
       App
       ============================================================ */
    const App = () => {
      const [quizOpen, setQuizOpen] = useState(false);
      const openQuiz  = () => setQuizOpen(true);
      const closeQuiz = () => setQuizOpen(false);
      const [waitlistPlan, setWaitlistPlan] = useState(null);
      const openWaitlist = (plan = "Pro") => setWaitlistPlan(plan);

      useReveal();

      return (
        <QuizContext.Provider value={{ openQuiz }}>
          <WaitlistContext.Provider value={{ openWaitlist }}>
          <Navigation />
          <main>
            <Hero />
            <StatBand />
            <PainPoints />
            <EveryFillTagged />
            <ProblemSolution />
            <HowItWorks />
            <PropTraderMode />
            <Features />
            <Comparison />
            <ThreePositive />
            <Security />
            <Pricing />
            <FAQ />
            <FinalCTA />
          </main>
          <Footer />
          <StickyQuizPill />
          <SupportWidget />
          <QuizFunnel open={quizOpen} onClose={closeQuiz} />
          {waitlistPlan && (
            <WaitlistModal plan={waitlistPlan} onClose={() => setWaitlistPlan(null)} />
          )}
          </WaitlistContext.Provider>
        </QuizContext.Provider>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
